# Daily job digest configuration for Michal Dub
# Primary host: GitHub Actions on nyvlt000/ai-job-search-codex (08:00 Europe/Berlin intent)

timezone: Europe/Berlin
email:
  to: md@michaldub.com
  # Verified Resend sender. Override with env RESEND_FROM if set.
  from: "Job Digest <onboarding@resend.dev>"
  # Credentials (never commit): RESEND_API_KEY, RESEND_FROM

jobage_days: 30
# Per-portal detail budgets so one board cannot starve the others.
detail_fetch_cap: 30
detail_fetch_cap_per_portal:
  linkedin-search: 20
  jobs-ch-search: 20
  jobscout24-search: 20
description_max_chars: 800
company_research_ttl_days: 30

# Enrichment order: Swiss boards first, then LinkedIn.
portal_enrich_order:
  - jobs-ch-search
  - jobscout24-search
  - linkedin-search

fit_keywords:
  - project manager
  - program manager
  - digital transformation
  - cloud migration
  - contact center
  - ccaas
  - unified communications
  - conversational ai
  - microsoft 365
  - teams
  - stakeholder
  - intranet
  # German / CH title variants
  - projektleiter
  - projektmanager
  - projektleitung
  - programmmanager
  - digitale transformation
  - contact centre
  - kundenservice
  - kundenkontakt
  - unified communication
  - cloud-migration
  - it-projekt

portals:
  linkedin-search:
    cli: .agents/skills/linkedin-search/cli/src/cli.ts
    queries:
      - query: "Project Manager"
        location: "Basel, Switzerland"
        limit: 10
      - query: "Project Manager"
        location: "Freiburg im Breisgau, Germany"
        limit: 10
      - query: "Digital Transformation"
        location: "Basel, Switzerland"
        limit: 10
      - query: "Contact Center"
        location: "Basel, Switzerland"
        limit: 10
      - query: "Cloud Migration"
        location: "Basel, Switzerland"
        limit: 10
      - query: "Unified Communications"
        location: "Remote"
        limit: 10
        remote: remote

  jobs-ch-search:
    cli: .agents/skills/jobs-ch-search/cli/src/cli.ts
    lang: en
    queries:
      - query: "project manager"
        location: "Basel"
        limit: 10
      - query: "Projektleiter"
        location: "Basel"
        limit: 10
      - query: "digital transformation"
        location: "Basel"
        limit: 10
      - query: "contact center"
        location: "Basel"
        limit: 10
      - query: "Projektmanager"
        location: "Basel"
        limit: 10

  jobscout24-search:
    cli: .agents/skills/jobscout24-search/cli/src/cli.ts
    lang: de
    queries:
      - query: "project manager"
        location: "Basel"
        limit: 10
      - query: "Projektleiter"
        location: "Basel"
        limit: 10
      - query: "digital transformation"
        location: "Basel"
        limit: 10
      - query: "contact center"
        location: "Basel"
        limit: 10
      - query: "Projektmanager"
        location: "Basel"
        limit: 10
