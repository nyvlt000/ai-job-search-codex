# Weekly job digest configuration for Michal Dub
# Primary host: GitHub Actions on nyvlt000/ai-job-search-codex (Mondays 08:00 CET)

timezone: Europe/Berlin
email:
  to: md@michaldub.com
  from: Job Digest <onboarding@resend.dev>
jobage_days: 30
detail_fetch_cap: 30
detail_fetch_cap_per_portal:
  linkedin-search: 20
  jobs-ch-search: 20
  jobscout24-search: 20
description_max_chars: 800
company_research_ttl_days: 30
portal_enrich_order:
- jobs-ch-search
- jobscout24-search
- linkedin-search
# Must align with search phrases. Avoid broad terms like kundenkontakt /
# bare "digital transformation" that let sales/HR roles into the digest.
fit_keywords:
- conversational ai engineer
- conversational ai
- contact center administrator
- contact center architect
- contact center project
- ccaas
- unified communications engineer
- unified communications
- unified communication
- it project manager
- it-projektleiter
- it projektleiter
- digital transformation manager
- digital transformation it
