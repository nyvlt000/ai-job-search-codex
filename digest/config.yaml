# Daily job digest configuration for Michal Dub
# Primary host: GitHub Actions on nyvlt000/ai-job-search-codex (daily 08:00 CET)

timezone: Europe/Berlin
email:
  to: md@michaldub.com
  from: Job Digest <onboarding@resend.dev>
jobage_days: 30
detail_fetch_cap: 30
detail_fetch_cap_per_portal:
  linkedin-search: 20
  jobs-ch-search: 20
  jobscout24-search: 20
description_max_chars: 800
company_research_ttl_days: 30
portal_enrich_order:
- jobs-ch-search
- jobscout24-search
- linkedin-search

# Hard location gate applied to every search result (case-insensitive regex).
# A job is kept only if its location matches an `allow` pattern and no `deny`
# pattern. Only Basel and Freiburg im Breisgau (Germany) pass.
location_filter:
  # Removed before matching: the canton "Basel-Country" (Liestal, Pratteln, ...)
  # is not the city of Basel.
  ignore:
  - basel-country
  - basel-landschaft
  - basel-land
  - baselland
  allow:
  - '\bbasel\b'
  # Freiburg needs a German marker: a bare "Freiburg" on the Swiss boards is
  # Fribourg, Switzerland.
  - '\bfreiburg\b.*(breisgau|baden|germany|deutschland)'
  - '^greater freiburg area$'
  deny:
  - fribourg

# Must align with search phrases. Avoid broad terms like kundenkontakt /
# bare "digital transformation" that let sales/HR roles into the digest.
# Matching is on whole words in the job title; hyphens and German gender
# markers are ignored, so "it projektmanager" also covers "IT-Projektmanager:in".
fit_keywords:
- conversational ai engineer
- conversational ai
- contact center administrator
- contact center architect
- contact center project
- ccaas
- unified communications engineer
- unified communications
- unified communication
- it project manager
- it projektleiter
- digital transformation manager
- digital transformation it
# German variants of the search phrases
- it projektmanager
- projektmanager it
- projektleiter it
- it projektleitung
- projektleitung it
- contact center spezialist
- spezialist contact center
- administrator contact center
- contact center architekt
- architekt contact center
- manager digitale transformation
- manager digital transformation
- digitalisierungsmanager

# Queries: Basel on all portals, Freiburg im Breisgau on LinkedIn only (the
# Swiss boards do not cover Germany). No "Remote" searches: they return jobs
# from all over the world.
portals:
  linkedin-search:
    cli: .agents/skills/linkedin-search/cli/src/cli.ts
    queries:
    - query: Conversational AI Engineer
      location: Basel, Switzerland
      limit: 10
    - query: Contact Center Administrator
      location: Basel, Switzerland
      limit: 10
    - query: Contact Center Architect
      location: Basel, Switzerland
      limit: 10
    - query: Unified Communications Engineer
      location: Basel, Switzerland
      limit: 10
    - query: IT Project Manager
      location: Basel, Switzerland
      limit: 10
    - query: Digital Transformation Manager
      location: Basel, Switzerland
      limit: 10
    - query: Conversational AI Engineer
      location: Freiburg im Breisgau, Germany
      limit: 10
    - query: Contact Center Administrator
      location: Freiburg im Breisgau, Germany
      limit: 10
    - query: Contact Center Architect
      location: Freiburg im Breisgau, Germany
      limit: 10
    - query: Unified Communications Engineer
      location: Freiburg im Breisgau, Germany
      limit: 10
    - query: IT Project Manager
      location: Freiburg im Breisgau, Germany
      limit: 10
    - query: Digital Transformation Manager
      location: Freiburg im Breisgau, Germany
      limit: 10
  jobs-ch-search:
    cli: .agents/skills/jobs-ch-search/cli/src/cli.ts
    lang: en
    queries:
    - query: Conversational AI Engineer
      location: Basel
      limit: 10
    - query: Contact Center Administrator
      location: Basel
      limit: 10
    - query: Contact Center Architect
      location: Basel
      limit: 10
    - query: Unified Communications Engineer
      location: Basel
      limit: 10
    - query: IT Project Manager
      location: Basel
      limit: 10
    - query: Digital Transformation Manager
      location: Basel
      limit: 10
  jobscout24-search:
    cli: .agents/skills/jobscout24-search/cli/src/cli.ts
    lang: de
    queries:
    - query: Conversational AI Engineer
      location: Basel
      limit: 10
    - query: Contact Center Administrator
      location: Basel
      limit: 10
    - query: Contact Center Architect
      location: Basel
      limit: 10
    - query: Unified Communications Engineer
      location: Basel
      limit: 10
    - query: IT Project Manager
      location: Basel
      limit: 10
    - query: Digital Transformation Manager
      location: Basel
      limit: 10
